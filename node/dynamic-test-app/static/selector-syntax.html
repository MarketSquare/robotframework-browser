<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Selector syntax</title>
</head>
<body>
  <!-- selector_syntax.robot: texts that look like Browser selector syntax, and labels. -->
  <button>Save >>> later</button>
  <button>label=Email</button>
  <label for="email">Email address</label><input id="email">
  <label>Phone <input id="phone"></label>
  <span id="city-label">City</span><input id="city" aria-labelledby="city-label">
  <div id="map" aria-label="Map widget"></div>
  <label for="customer">Customer's name</label><input id="customer">
  <iframe id="outer" src="selector-syntax-frame.html" width="400" height="200"></iframe>
  <script src="/test-app-logger.js"></script>
</body>
</html>

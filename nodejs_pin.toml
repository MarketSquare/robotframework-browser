# The NodeJS shipped inside the BrowserBatteries wheel, and the platform floors
# that decide which wheels pip will install. Read by tasks.py, and rewritten by
# the bot in .github/workflows/on-schedule.yml when a newer release turns up in
# the line we already ship. Moving to a new LTS line is left to a human on
# purpose: it changes the wheel tags, and the table in browser_batteries/README.md
# has to be worked out again by hand.

# This is the runtime that ends up on the user's machine, not the NodeJS that
# builds the library.
version = "24.20.0"

# sha256 of the SHASUMS256.txt nodejs.org publishes for `version`. Checked
# before anything trusts that manifest, because on its own the manifest only
# proves an archive arrived intact from whoever served it.
shasums_sha256 = "c614a913a302d35d1c3a1348d07d84c52e28dceb0b97fd91e4ade05906ca2bd7"

# Oldest platforms the official NodeJS builds above run on, from
# https://github.com/nodejs/node/blob/main/BUILDING.md. These decide the wheel
# tags, so bumping `version` means checking them again: tagging a wheel as more
# portable than the NodeJS inside it turns "no compatible wheel" into a loader
# error after a successful install. `min_macos` has to stay on a .0 boundary
# even though NodeJS itself targets 13.5, because pip only ever generates
# macosx_<major>_0_* tags for macOS 11 and newer.
min_glibc = "2_28"
min_macos = "13_0"

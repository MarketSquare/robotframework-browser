name: Scheduled NodeJS checks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodejs_checks:
    name: Check the NodeJS we ship
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install invoke --python 3.14 --system
      - name: Check the NodeJS version we ship
        run: |
          inv node-version-check
      - name: Check the NodeJS platform floors
        if: always()
        run: |
          inv node-floor-check

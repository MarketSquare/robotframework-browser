name: Scheduled NodeJS checks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodejs_checks:
    name: Check the NodeJS we ship
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install invoke --python 3.14 --system
      - name: Check the NodeJS platform floors
        run: |
          inv node-floor-check
      - name: Work out the new pin
        id: bump
        if: ${{ !cancelled() }}
        run: |
          inv node-pin-bump --write --report "${RUNNER_TEMP}/pr-body.md"
      - name: Get a token for the pull request
        id: app-token
        if: ${{ !cancelled() && steps.bump.outputs.version != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NODEJS_PIN_BOT_APP_ID }}
          private-key: ${{ secrets.NODEJS_PIN_BOT_PRIVATE_KEY }}
      - name: Propose the bump
        if: ${{ !cancelled() && steps.bump.outputs.version != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/nodejs-pin
          delete-branch: true
          add-paths: nodejs_pin.toml
          labels: dependencies
          title: "build(deps): bump bundled NodeJS to ${{ steps.bump.outputs.version }}"
          commit-message: "build(deps): bump bundled NodeJS to ${{ steps.bump.outputs.version }}"
          body-path: ${{ runner.temp }}/pr-body.md

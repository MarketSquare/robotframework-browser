# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 10 * * *'

env:
  SYS_VAR_CI_INSTALL_TEST: 0

jobs:
  # The version the wheels of this run carry. Empty unless this is a push to
  # main, which keeps pull request and scheduled runs building exactly the
  # versions they build today.
  nightly_version:
    name: Work out the nightly version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.dev.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv sync --locked --no-build --only-group dev
      - name: Work out the version
        id: dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inv dev-version

  testing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      # The lowest rf-version below is the supported Robot Framework floor and must
      # match the robotframework lower bound in pyproject.toml. Change both together.
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
            node-version: 22.x
            shard: 1
            rf-version: "7.5.1"
          - os: windows-latest
            python-version: "3.12"
            node-version: 24.x
            shard: 2
            rf-version: "7.1.1"
          - os: ubuntu-latest
            python-version: "3.15"
            node-version: 22.x
            shard: 3
            rf-version: "7.5.1"
          - os: ubuntu-latest
            python-version: "3.11"
            node-version: 26.x
            shard: 4
            rf-version: "7.1.1"
          - os: windows-latest
            python-version: "3.15"
            node-version: 24.x
            shard: 1
            rf-version: "7.5.1"
          - os: ubuntu-latest
            python-version: "3.11"
            node-version: 22.x
            shard: 2
            rf-version: "7.1.1"
          - os: ubuntu-latest
            python-version: "3.13"
            node-version: 22.x
            shard: 3
            rf-version: "7.1.1"
          - os: ubuntu-latest
            python-version: "3.12"
            node-version: 24.x
            shard: 4
            rf-version: "7.1.1"
          - os: ubuntu-latest
            python-version: "3.14"
            node-version: 22.x
            shard: 1
            rf-version: "7.5.1"
          - os: ubuntu-latest  # Use to be macos-latest but moved to ubuntu-latest for now due to https://github.com/orgs/community/discussions/211885
            python-version: "3.11"
            node-version: 24.x
            shard: 1
            rf-version: "7.5.1"
          - os: macos-latest
            python-version: "3.11"
            node-version: 24.x
            shard: 2
            rf-version: "7.1.1"
          - os: macos-latest
            python-version: "3.15"
            node-version: 26.x
            shard: 3
            rf-version: "7.5.1"
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install nodejs dependencies
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: 0
      run: |
        npm ci # installs from package-lock.json; grpc-tools needs its install script
        .github/scripts/install-playwright.sh
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install python dependencies
      env:
        # Python 3.15 is a prerelease, and some dependencies ship no wheels for it yet.
        UV_NO_BUILD: ${{ matrix.python-version != '3.15' }}
      run: |
        uv sync --locked
        uv pip install robotframework==${{ matrix.rf-version }}
        python atest/library/os_wrapper.py
    - name: Build stubs
      run: |
        inv node-build
    - name: Check types with mypy on Linux
      if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
      run: |
        inv lint-python
    - name: Lint atest
      if: matrix.shard == 1
      run: |
        inv lint-robot
    - name: Lint node
      if: matrix.shard == 1
      run: |
        inv lint-node
    - name: Build test app
      run: |
        inv create-test-app
    - name: Start xvfb on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        export DISPLAY=:99.0
        Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 &
    # Shard 1 is pinned to the latest Robot Framework, so the extra condition is what runs
    # the unit tests against the supported floor as well. Keep one entry of each rf-version.
    - name: Run pytests
      if: matrix.shard == 1 || (matrix.rf-version == '7.1.1' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13')
      run: |
        invoke utest
    - uses: actions/upload-artifact@v7
      if: ${{ always() && hashFiles('utest/output/pytest_xunit.xml') != '' }}
      with:
        name: Unit test results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: |
          utest/output/pytest_xunit.xml
          utest/output/test-app/
    - name: Run Node.js unit tests with coverage
      if: matrix.shard == 1
      run: |
        npm run test:coverage
        node node/coverage-summary.mjs
    - uses: actions/upload-artifact@v7
      if: matrix.shard == 1
      with:
        name: node-coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: node/coverage/
    - name: Run Robot Framework tests on linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        xvfb-run --auto-servernum inv atest --shard ${{ matrix.shard }}/4
    - name: Run Robot Framework tests on Windows
      if: matrix.os == 'windows-latest'
      run: |
        inv atest --shard ${{ matrix.shard }}/4
    - name: Run Robot Framework tests on macOS
      if: matrix.os == 'macos-latest'
      run: |
        inv atest --shard ${{ matrix.shard }}/4
    - uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: Test results-${{ matrix.os }}-${{ matrix.shard }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: atest/output
    # A process that dies from a signal often prints nothing; the macOS crash report holds the
    # faulting stack. A child that crashed between fork and exec is reported as Python.
    - name: Collect crash reports on macOS
      if: ${{ always() && matrix.os == 'macos-latest' }}
      run: |
        mkdir -p crash-reports
        find ~/Library/Logs/DiagnosticReports \( -name 'node*' -o -iname 'python*' \) -exec cp {} crash-reports/ \; || true
    - uses: actions/upload-artifact@v7
      if: ${{ always() && matrix.os == 'macos-latest' }}
      with:
        name: Crash reports-${{ matrix.os }}-${{ matrix.shard }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: crash-reports/
        if-no-files-found: ignore
    - name: Github Job Summary
      if: ${{ always() && hashFiles('atest/output/output.xml') != '' }}
      run: |
        python -m GHAReports --robotlog atest/output/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
        cat fail.md

  # Python and Node.js coverage from every suite, in one report, scanned by
  # SonarQube with the linter findings. Linux runs the largest test set and is
  # the only platform where Node.js coverage flushes. Advisory, so it stays out
  # of the needs of publish_nightly. Each suite runs even when an earlier one
  # failed, so a failing test still leaves a report.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Read at build time by node/build.wrapper.js and at run time by the library.
      ROBOT_FRAMEWORK_BROWSER_NODE_COVERAGE: 1
      # Job level, so that the scan step's if can see it. Empty in forks and
      # Dependabot runs, which skips only the scan.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube needs the history to tell new code from old
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install nodejs dependencies
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npm ci # installs from package-lock.json; grpc-tools needs its install script
          .github/scripts/install-playwright.sh
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install python dependencies and lcov
        run: |
          uv sync --locked --no-build
          python atest/library/os_wrapper.py
          sudo apt-get install --yes --no-install-recommends lcov
      - name: Build
        id: build
        run: |
          inv node-build
          inv create-test-app
      - name: Run pytests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          inv utest
      - name: Run Node.js unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          inv utest-node --coverage
      - name: Run Robot Framework tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run --auto-servernum inv atest-coverage
      - name: Merge the coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          inv coverage-report
      # The reports are advisory, so findings do not fail these commands. mypy has
      # no exit-zero flag: 1 means findings, anything higher means it broke.
      - name: Generate linter reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          robocop check atest --config pyproject.toml --reports sonarqube --exit-zero
          ruff check Browser browser_batteries atest --config pyproject.toml --exit-zero --output-format json --output-file ruff.json
          mypy Browser browser_batteries atest/library --exclude .venv --config-file Browser/mypy.ini --no-error-summary --show-column-numbers > mypy.txt || [ $? -eq 1 ]
      # The Free plan analyses only main and pull requests targeting it. A failed
      # build would scan with no coverage at all, so it skips the scan.
      - name: Scan
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success' && env.SONAR_TOKEN != '' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && github.base_ref == 'main')
          ) }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage
          path: |
            coverage/
            node/coverage/lcov.info
            atest/output/node-coverage-report/lcov.info
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Coverage test results
          path: |
            utest/output/pytest_xunit.xml
            atest/output
          if-no-files-found: ignore

  test-install:
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
        node-version: [22.x, 24.x]
        exclude:
          - python-version: "3.11"
            node-version: 22.x
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            node-version: 22.x
    steps:
      - uses: actions/checkout@v7
      - name: Download package for install testing
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
      - name: Download package for install testing
        uses: actions/download-artifact@v8
        with:
          name: demoapp-${{ matrix.os }}
          path: zip_results/demoapp
      - name: Unzip demoapp in *nix like
        if: matrix.os != 'windows-latest'
        run: |
          ls -l zip_results/demoapp
          unzip -o zip_results/demoapp/demo-app-linux.zip
      - name: Unzip demoapp in windows
        if: matrix.os == 'windows-latest'
        run: |
          dir zip_results/demoapp
          tar -xf zip_results/demoapp/demo-app-win32.zip
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Robot Framework Browser on *nix like
        run: |
          uv pip install ./robotframework_browser-*-py3-none-any.whl  --python ${{ matrix.python-version }} --system
        if: matrix.os != 'windows-latest'
      - name: Install Robot Framework Browser on windows
        run: |
          uv pip install (gci *.whl)--python ${{ matrix.python-version }} --system
        if: matrix.os == 'windows-latest'
      - name: Install node deps and python deps for test running
        run: |
          rfbrowser init
          uv export --locked --only-group dev --no-emit-project --output-file dev-requirements.txt
          uv pip install --require-hashes --no-build -r dev-requirements.txt --python ${{ matrix.python-version }} --system
      - name: Test on Ubuntu - serial mode
        if: matrix.os == 'ubuntu-latest'
        env:
          SYS_VAR_CI_INSTALL_TEST: 1
        run: |
          rm -rf Browser
          export DISPLAY=:99.0
          Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 &
          xvfb-run --auto-servernum invoke atest-robot --smoke
      - name: Run Robot Framework tests on windows or macOS
        if: matrix.os != 'ubuntu-latest'
        env:
          SYS_VAR_CI_INSTALL_TEST: 1
        run: |
          Remove-Item -Path .\Browser -Force -Recurse
          invoke atest-robot --smoke
      - name: Uninstall on Linux or MacOS
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          rfbrowser clean-node
          uv pip uninstall robotframework-browser  --python ${{ matrix.python-version }} --system
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.node-version }} Clean install results
          path: atest/output
      - name: Github Job Summary
        if: ${{ always() && hashFiles('atest/output/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog atest/output/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md

  # The Browser wheel, the BrowserBatteries wheels and the demo apps that every
  # install test and the nightly use.
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: nightly_version
    timeout-minutes: 45
    env:
      # This job only builds wheels, no need to download Playwright browsers
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: 'npm'
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        env:
          # cryptography ships no Intel macOS wheels, so that runner builds it.
          UV_NO_BUILD: ${{ matrix.os != 'macos-15-intel' }}
        run: |
          uv sync --locked
          python -c "import sys;print(sys.platform)"
          python -c "import sysconfig;print(sysconfig.get_platform())"
          python -c "import platform;print(platform.machine().lower())"
          inv deps
      - name: Stamp the nightly version
        if: needs.nightly_version.outputs.version != ''
        run: |
          inv version ${{ needs.nightly_version.outputs.version }}
      - name: Build stubs
        if: matrix.os == 'ubuntu-latest'
        run: |
          inv node-build
      - name: Create Distributable Browser Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          inv docs
          inv create-package
      - uses: actions/upload-artifact@v7
        name: Upload rfbrowser-wheel
        if: matrix.os == 'ubuntu-latest'
        with:
          name: rfbrowser-wheel
          path: dist/robotframework_browser-*-py3-none-any.whl
          if-no-files-found: error
      - name: Build test app
        run: |
          inv create-test-app
      - name: Package demoapp
        run: |
          inv demo-app
      - uses: actions/upload-artifact@v7
        with:
          name: demoapp-${{ matrix.os }}
          path: zip_results/demoapp
          if-no-files-found: error
      - name: Create Distributable BrowserBatteries Package
        run: |
          inv package-nodejs
      - uses: actions/upload-artifact@v7
        with:
          name: browser-batteries-wheels-${{ matrix.os }}
          path: browser_batteries/dist/robotframework_browser_batteries-*.whl
          if-no-files-found: error

  test_browser_batteries_wheels:
    needs:
      - build_wheels
    name: Test wheels on ${{ matrix.os }} for BrowserBatteries tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15-intel", "macos-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: 'pip'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Download browser-wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: rfbrowser-wheel
      - name: Download BrowserBatteries wheel
        uses: actions/download-artifact@v8
        with:
          name: browser-batteries-wheels-${{ matrix.os }}
          path: browser-batteries-wheels
      - name: Download demoapp
        uses: actions/download-artifact@v8
        with:
          name: demoapp-${{ matrix.os }}
          path: demoapp
      - name: Install Browser and BrowserBatteries
        if: matrix.os != 'windows-latest'
        run: |
          pip install rfbrowser-wheel/robotframework_browser-*-py3-none-any.whl
          pip install browser-batteries-wheels/robotframework_browser_batteries-*-py3-none-*.whl
          rfbrowser --version
          .github/scripts/install-playwright.sh rfbrowser install
      - name: Install Browser and BrowserBatteries On Windows
        if: matrix.os == 'windows-latest'
        run: |
          pip install (Resolve-Path rfbrowser-wheel/robotframework_browser-*-py3-none-any.whl)
          pip install (Resolve-Path browser-batteries-wheels/robotframework_browser_batteries-*-py3-none-*.whl)
          rfbrowser --version
          rfbrowser install
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install test dependencies
        run: |
          uv export --locked --only-group dev --no-emit-project --output-file dev-requirements.txt
          uv pip install --require-hashes ${{ matrix.os != 'macos-15-intel' && '--no-build' || '' }} -r dev-requirements.txt --python 3.14 --system
      - name: Unzip demoapp *nix
        if: matrix.os != 'windows-latest'
        run: |
          rm -rf Browser
          rm -rf node
          rm -rf browser_batteries
          ls -l demoapp
          unzip demoapp/demo-app*.zip -d .
      - name: Unzip demoapp Windows
        if: matrix.os == 'windows-latest'
        run: |
          Remove-Item -Path .\Browser -Force -Recurse
          Remove-Item -Path .\node -Force -Recurse
          Remove-Item -Path .\browser_batteries -Force -Recurse
          dir demoapp
          Expand-Archive -Path (Resolve-Path demoapp/demo-app*.zip) -DestinationPath .
      - name: Run tests on ${{ matrix.os }} with packed demoapp
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          xvfb-run --auto-servernum invoke atest-robot --smoke
      - name: Run tests on ${{ matrix.os }} with packed demoapp
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        run: |
          inv atest-robot
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Clean_install_results_${{ matrix.os }}
          path: atest/output
      - name: Github Job Summary
        if: ${{ always() && hashFiles('atest/output/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog atest/output/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md
      - name: Uninstall
        run: |
          rfbrowser clean-node
          pip uninstall -y robotframework-browser-batteries
          pip uninstall -y robotframework-browser

  docker_image:
    runs-on: ubuntu-latest
    needs: build_wheels
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/marketsquare/robotframework-browser/rfbrowser
          tags: |
            type=raw,value=tidii
      - name: Download browser wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: docker/dist
      - name: Build with GitHub Packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev_pr
          tags: tidii
          labels: ${{ steps.meta.outputs.labels }}
          push: false
      - name: Download demo app
        uses: actions/download-artifact@v8
        with:
          name: demoapp-ubuntu-latest
          path: demoapp
      - name: unzip demo app
        run: |
          rm -rf node
          ls -l demoapp
          unzip demoapp/demo-app*.zip -d .
          ls -l node
      - name: Start demo app and run tests with docker image
        run: |
          uv sync --locked --no-build --only-group dev
          set +e
          docker run \
            -v ./atest/:/home/pwuser/atest \
            -v ./node/:/home/pwuser/node \
            -t tidii:latest \
            bash -lc "
              node /home/pwuser/node/dynamic-test-app/dist/server.js > /tmp/test-app.log 2>&1 &
              app_pid=\$!
              for i in \$(seq 1 30); do
                if curl --fail --silent --show-error http://localhost:7272/dist/ > /dev/null; then
                  break
                fi
                sleep 1
              done
              if ! curl --fail --silent --show-error http://localhost:7272/dist/ > /dev/null; then
                echo 'Test app failed to start inside container.'
                cat /tmp/test-app.log
                exit 1
              fi
              robot -v SERVER:localhost:7272 --exclude no-docker-pr -L debug --outputdir /home/pwuser/output /home/pwuser/atest/test
              robot_status=\$?
              kill \$app_pid || true
              wait \$app_pid 2>/dev/null || true
              exit \$robot_status
            "
          docker_status=$?
          inv docker-copy-output
          copy_status=$?
          if [ "$docker_status" -ne 0 ]; then
            exit "$docker_status"
          fi
          exit "$copy_status"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: docker_results
          path: output_docker
      - name: Github Job Summary
        if: ${{ always() && hashFiles('output_docker/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog output_docker/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md

  # Everything green on main becomes the wheels at
  # https://github.com/MarketSquare/robotframework-browser/releases/tag/nightly
  # so that a fix can be tried out without waiting for a release. Needs the test
  # jobs and not just the build jobs, because untested wheels are worse than no
  # wheels: whoever installs them cannot tell our breakage from theirs.
  publish_nightly:
    name: Publish the nightly wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - nightly_version
      - testing
      - test-install
      - build_wheels
      - test_browser_batteries_wheels
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the Browser wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: nightly-wheels
      - name: Download the BrowserBatteries wheels
        uses: actions/download-artifact@v8
        with:
          pattern: browser-batteries-wheels-*
          merge-multiple: true
          path: nightly-wheels
      - name: Replace the assets on the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.nightly_version.outputs.version }}
        run: |
          bash .github/scripts/publish-nightly.sh
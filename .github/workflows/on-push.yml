# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 10 * * *'

# A new push to a pull request cancels its run that is still going. Every other
# run gets a group of its own, so that no push to main waits for or cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  SYS_VAR_CI_INSTALL_TEST: 0
  # The browser the acceptance tests run in; its known bugs are left out.
  ATEST_BROWSER: firefox

jobs:
  # The jobs run on Namespace runners, each matrix entry names its machine.
  # matrix.os stays the GitHub image name, which the step conditions and
  # artifact names use. pabot runs one process per vCPU but one.
  #
  # Lint and the unit tests start at once and are done before the acceptance
  # tests need the machines. The acceptance tests run in ten entries, each
  # with its own Python, Robot Framework and Node.js: atest-source runs them
  # from the checkout with coverage and starts at once, the atest-wheel jobs
  # install the built wheels as a user would. The coverage job merges the
  # coverage of the unit and the source acceptance tests and scans it with
  # SonarQube.
  #
  # The workspace runs at most 160 Linux, 80 Windows and 48 macOS vCPU at a
  # time, so the sizes trade the speed of a job against the jobs queued behind
  # it. One run takes up to about 110 Linux vCPU. Measured on the whole
  # acceptance suite: 8 vCPU take 140 s, 16 take 85 s and 32 take 75 s. The
  # unit tests run serially and get the small machines.
  # macos-15-intel stays on GitHub: Namespace has no Intel macOS machines.
  #
  # Lint, the Linux unit tests and atest-source keep their npm and apt
  # downloads on a Namespace cache volume; only runs on main update it. The
  # wheel tests download everything, as a user's installation does. Every
  # Linux job keeps the Node.js and Python that setup-node and setup-python
  # fetch from GitHub in Namespace's tool cache, since those downloads time out
  # now and then.

  # Namespace machines cost money, so the scheduled run, where time does not
  # matter, and pull requests from forks run on GitHub's free runners, with the
  # same tests but slower, unless the fork's author can write to this
  # repository. To run another one on Namespace, a maintainer
  # adds the label namespace and reruns all jobs: the label is read when this
  # job runs, not from the event. A failing lookup falls back to GitHub.
  runners:
    name: Choose the runners
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      namespace: ${{ steps.choose.outputs.namespace }}
    steps:
      - name: Choose Namespace or GitHub's runners
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          OWN_BRANCH: >-
            ${{ github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SCHEDULED" = true ]; then
            echo "namespace=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          namespace="$OWN_BRANCH"
          if [ "$namespace" != true ]; then
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission || echo none)
            echo "$AUTHOR can $permission this repository."
            case "$permission" in
              admin | maintain | write) namespace=true ;;
            esac
          fi
          if [ "$namespace" != true ] &&
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx namespace; then
            namespace=true
          fi
          echo "namespace=$namespace" | tee -a "$GITHUB_OUTPUT"

  # The version the wheels of this run carry. Empty unless this is a push to
  # main, which keeps pull request and scheduled runs building exactly the
  # versions they build today.
  nightly_version:
    name: Work out the nightly version
    needs: runners
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-2x4-with-cache", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.dev.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        run: |
          uv sync --locked --no-build --only-group dev
      - name: Work out the version
        id: dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inv dev-version

  lint:
    name: Lint
    needs: runners
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-cache-tag-robotframework-browser", "nscloud-cache-allow-commit-from-main", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: ${{ needs.runners.outputs.namespace != 'true' && 'npm' || '' }}
      - name: Use the Namespace cache volume
        if: ${{ needs.runners.outputs.namespace == 'true' }}
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: ~/.npm
      - name: Install nodejs dependencies
        run: |
          npm ci # installs from package-lock.json; grpc-tools needs its install script
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Install python dependencies
        run: |
          uv sync --locked --no-build
      - name: Build stubs
        run: |
          inv node-build
      - name: Lint Python
        run: |
          inv lint-python
      - name: Lint atest
        if: ${{ !cancelled() }}
        run: |
          inv lint-robot
      - name: Lint node
        if: ${{ !cancelled() }}
        run: |
          inv lint-node
      # The reports are advisory, so findings do not fail these commands. mypy has
      # no exit-zero flag: 1 means findings, anything higher means it broke.
      - name: Generate linter reports for SonarQube
        if: ${{ !cancelled() }}
        run: |
          robocop check atest --config pyproject.toml --reports sonarqube --exit-zero
          ruff check Browser browser_batteries atest --config pyproject.toml --exit-zero --output-format json --output-file ruff.json
          mypy Browser browser_batteries atest/library --exclude .venv --config-file Browser/mypy.ini --no-error-summary --show-column-numbers > mypy.txt || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linter-reports
          path: |
            robocop_sonar_qube.json
            ruff.json
            mypy.txt
          if-no-files-found: ignore

  utest:
    name: Unit tests (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.node-version }})
    needs: runners
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && matrix.runner || matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Every Python, Robot Framework and Node.js version and every OS runs once.
      # The lowest rf-version is the supported Robot Framework floor and must
      # match the robotframework lower bound in pyproject.toml. Change both
      # together.
      matrix:
        include:
          - os: ubuntu-latest
            runner: &utest_linux_runner ["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-cache-tag-robotframework-browser", "nscloud-cache-allow-commit-from-main", "nscloud-runner-tool-cache-20gb"]
            python-version: "3.11"
            rf-version: "7.1.1"
            node-version: 22.x
          - os: windows-latest
            runner: nscloud-windows-2022-amd64-8x16
            python-version: "3.12"
            rf-version: "7.2.2"
            node-version: 24.x
          - os: macos-latest
            runner: nscloud-macos-sequoia-arm64-6x14
            python-version: "3.13"
            rf-version: "7.3.2"
            node-version: 26.x
          - os: ubuntu-latest
            runner: *utest_linux_runner
            python-version: "3.14"
            rf-version: "7.4.2"
            node-version: 24.x
          - os: ubuntu-latest
            runner: *utest_linux_runner
            python-version: "3.15"
            rf-version: "7.5.1"
            node-version: 26.x
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ (needs.runners.outputs.namespace != 'true' || runner.os != 'Linux') && 'npm' || '' }}
    - name: Use the Namespace cache volume
      if: ${{ needs.runners.outputs.namespace == 'true' && runner.os == 'Linux' }}
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: apt
        path: ~/.npm
    - name: Install nodejs dependencies
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: 0
      run: |
        npm ci # installs from package-lock.json; grpc-tools needs its install script
        .github/scripts/install-playwright.sh
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install python dependencies
      env:
        # Python 3.15 is a prerelease, and some dependencies ship no wheels for it yet.
        UV_NO_BUILD: ${{ matrix.python-version != '3.15' }}
      run: |
        uv sync --locked
        uv pip install robotframework==${{ matrix.rf-version }}
        python atest/library/os_wrapper.py
    - name: Build stubs and test app
      run: |
        inv node-build
        inv create-test-app
    - name: Run pytests
      run: |
        invoke utest
    # Named per entry, so that the coverage job can combine them all.
    - name: Name the coverage data
      if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
      shell: bash
      run: |
        mv .coverage ".coverage.utest-${{ matrix.os }}-${{ matrix.python-version }}"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: coverage-utest-${{ matrix.os }}-${{ matrix.python-version }}
        path: .coverage.utest-*
        include-hidden-files: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7
      if: ${{ always() && hashFiles('utest/output/pytest_xunit.xml') != '' }}
      with:
        name: Unit test results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: |
          utest/output/pytest_xunit.xml
          utest/output/test-app/
    - name: Run Node.js unit tests with coverage
      if: ${{ !cancelled() }}
      run: |
        npm run test:coverage
        node node/coverage-summary.mjs
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: node-coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: node/coverage/

  # The acceptance tests from the checkout, with Python and Node.js coverage and
  # one Node.js process that every pabot worker shares, the way `inv atest`
  # runs them. They need no wheel, so they start with the build.
  atest-source:
    name: Acceptance tests from source (${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.batteries && 'BrowserBatteries' || matrix.node-version }})
    needs: runners
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-16x32-with-cache", "nscloud-cache-tag-robotframework-browser", "nscloud-cache-allow-commit-from-main", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Read at build time by node/build.wrapper.js and at run time by the library.
      ROBOT_FRAMEWORK_BROWSER_NODE_COVERAGE: 1
    strategy:
      fail-fast: false
      # With atest-wheel, every Python and Robot Framework version runs once
      # with the system Node.js and once with BrowserBatteries, and no two of
      # the ten entries share their Python and Robot Framework versions.
      matrix:
        include:
          - python-version: "3.14"
            rf-version: "7.4.2"
            node-version: 24.x
          - python-version: "3.15"
            rf-version: "7.5.1"
            node-version: 26.x
          - python-version: "3.12"
            rf-version: "7.4.2"
            node-version: 24.x
            batteries: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ needs.runners.outputs.namespace != 'true' && 'npm' || '' }}
      - name: Use the Namespace cache volume
        if: ${{ needs.runners.outputs.namespace == 'true' }}
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: apt
          path: ~/.npm
      - name: Install nodejs dependencies
        if: ${{ !matrix.batteries }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npm ci # installs from package-lock.json; grpc-tools needs its install script
          .github/scripts/install-playwright.sh
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install python dependencies
        env:
          # Python 3.15 is a prerelease, and some dependencies ship no wheels for it yet.
          UV_NO_BUILD: ${{ matrix.python-version != '3.15' }}
        run: |
          uv sync --locked
      # Builds everything, the Node.js dependencies and browsers included, and
      # puts the NodeJS binary next to the coverage build of the wrapper.
      - name: Assemble BrowserBatteries
        if: ${{ matrix.batteries }}
        env:
          UV_NO_BUILD: ${{ matrix.python-version != '3.15' }}
        run: |
          inv build-nodejs
      # The library imports its generated protobuf before the task builds anything.
      - name: Build stubs
        if: ${{ !matrix.batteries }}
        run: |
          inv node-build
      - name: Install Robot Framework ${{ matrix.rf-version }}
        env:
          UV_NO_BUILD: ${{ matrix.python-version != '3.15' }}
        run: |
          uv pip install robotframework==${{ matrix.rf-version }}
          python atest/library/os_wrapper.py
      - name: Run Robot Framework tests with coverage
        run: |
          xvfb-run --auto-servernum inv atest-coverage --browser ${{ env.ATEST_BROWSER }} ${{ matrix.batteries && '--batteries' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-atest-${{ matrix.python-version }}-${{ matrix.batteries && 'batteries' || 'node' }}
          path: |
            .coverage.*
            atest/output/node-coverage-report/lcov.info
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Source test results-ubuntu-latest-${{ matrix.python-version }}-${{ matrix.batteries && 'batteries' || matrix.node-version }}
          path: atest/output
      - name: Github Job Summary
        if: ${{ always() && hashFiles('atest/output/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog atest/output/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md

  # Python and Node.js coverage of the unit tests and the source acceptance
  # tests, in one report, scanned by SonarQube with the linter findings.
  # Advisory, so it stays out of the needs of publish_nightly. It merges
  # whatever coverage the tests left, also when some of them failed.
  coverage:
    name: Coverage
    needs: [runners, lint, utest, atest-source]
    if: ${{ !cancelled() && needs.runners.result == 'success' }}
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-4x8-with-cache", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Job level, so that the scan step's if can see it. Empty in forks and
      # Dependabot runs, which skips only the scan.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube needs the history to tell new code from old
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install python dependencies and lcov
        run: |
          uv sync --locked --no-build
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lcov
      - name: Download the coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Download the Node.js unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: node-coverage-ubuntu-latest-3.14-24.x
          path: node/coverage
      - name: Download the linter reports
        uses: actions/download-artifact@v8
        with:
          name: linter-reports
      - name: Merge the coverage
        id: report
        run: |
          coverage combine --data-file=.coverage $(find coverage-data -name '.coverage.utest-*')
          find coverage-data -name '.coverage.*' -exec mv {} . \;
          tracefiles=$(find coverage-data -name lcov.info -printf '--add-tracefile %p ')
          if [ -n "$tracefiles" ]; then
            mkdir -p atest/output/node-coverage-report
            lcov --branch-coverage --ignore-errors inconsistent,inconsistent --quiet \
              $tracefiles --output-file atest/output/node-coverage-report/lcov.info
          fi
          inv coverage-report
      # The Free plan analyses only main and pull requests targeting it. A failed
      # merge would scan with no coverage at all, so it skips the scan.
      - name: Scan
        if: >-
          ${{ !cancelled() && steps.report.outcome == 'success' && env.SONAR_TOKEN != '' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && github.base_ref == 'main')
          ) }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      # A fork pull request gets no SONAR_TOKEN, so it hands its reports to
      # sonar-fork-pr.yml, which scans them in the base repository.
      - name: Write the pull request number for the fork scan
        id: fork-reports
        if: >-
          ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name == 'pull_request' &&
            github.base_ref == 'main' && github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > sonar-pr-number
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.fork-reports.outcome == 'success' }}
        with:
          name: sonar-fork-pr
          path: |
            sonar-pr-number
            coverage/python.xml
            coverage/node.info
            ruff.json
            mypy.txt
            robocop_sonar_qube.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage
          path: |
            coverage/
            node/coverage/lcov.info
            atest/output/node-coverage-report/lcov.info
          if-no-files-found: ignore

  # The Browser wheel, the BrowserBatteries wheels and the demo apps that every
  # install test and the nightly use. One job per platform, so that the wheel
  # tests of a platform wait only for its own build and for this one, which
  # also builds the Browser wheel.
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-8x16-with-cache", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    needs: [runners, nightly_version]
    timeout-minutes: 45
    env: &build_wheels_env
      # This job only builds wheels, no need to download Playwright browsers
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps: &build_wheels_steps
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: 'npm'
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        env:
          # cryptography ships no Intel macOS wheels, so that runner builds it.
          UV_NO_BUILD: ${{ matrix.os != 'macos-15-intel' }}
        run: |
          uv sync --locked
          python -c "import sys;print(sys.platform)"
          python -c "import sysconfig;print(sysconfig.get_platform())"
          python -c "import platform;print(platform.machine().lower())"
          inv deps
      - name: Stamp the nightly version
        if: needs.nightly_version.outputs.version != ''
        run: |
          inv version ${{ needs.nightly_version.outputs.version }}
      - name: Build stubs
        if: matrix.os == 'ubuntu-latest'
        run: |
          inv node-build
      - name: Create Distributable Browser Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          inv docs
          inv create-package
      - uses: actions/upload-artifact@v7
        name: Upload rfbrowser-wheel
        if: matrix.os == 'ubuntu-latest'
        with:
          name: rfbrowser-wheel
          path: dist/robotframework_browser-*-py3-none-any.whl
          if-no-files-found: error
      - name: Build test app
        run: |
          inv create-test-app
      - name: Package demoapp
        run: |
          inv demo-app
      - uses: actions/upload-artifact@v7
        with:
          name: demoapp-${{ matrix.os }}
          path: zip_results/demoapp
          if-no-files-found: error
      - name: Create Distributable BrowserBatteries Package
        run: |
          inv package-nodejs
      - uses: actions/upload-artifact@v7
        with:
          name: browser-batteries-wheels-${{ matrix.os }}
          path: browser_batteries/dist/robotframework_browser_batteries-*.whl
          if-no-files-found: error

  build_wheels_arm:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-arm64-8x16-with-cache", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-24.04-arm' }}
    needs: [runners, nightly_version]
    timeout-minutes: 45
    env: *build_wheels_env
    strategy:
      matrix:
        os: [ ubuntu-24.04-arm ]
    steps: *build_wheels_steps

  build_wheels_windows:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && 'nscloud-windows-2022-amd64-8x16' || 'windows-latest' }}
    needs: [runners, nightly_version]
    timeout-minutes: 45
    env: *build_wheels_env
    strategy:
      matrix:
        os: [ windows-latest ]
    steps: *build_wheels_steps

  build_wheels_macos:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && 'nscloud-macos-sequoia-arm64-6x14' || 'macos-latest' }}
    needs: [runners, nightly_version]
    timeout-minutes: 45
    env: *build_wheels_env
    strategy:
      matrix:
        os: [ macos-latest ]
    steps: *build_wheels_steps

  # Namespace has no Intel macOS machines. Only the nightly and the scheduled
  # run use this wheel, so in its own job the tests do not wait for GitHub's
  # slower runner.
  build_wheels_intel:
    name: Build wheels on ${{ matrix.os }}
    runs-on: macos-15-intel
    needs: nightly_version
    timeout-minutes: 45
    env: *build_wheels_env
    strategy:
      matrix:
        os: [ macos-15-intel ]
    steps: *build_wheels_steps

  # The acceptance tests against the wheels of build_wheels, installed as a user
  # would: the Browser wheel with `rfbrowser init` on the system Node.js, or
  # with the BrowserBatteries wheel of the platform and its own NodeJS. Every
  # pabot process starts its own Node.js process, unlike in atest-source.
  # One job per platform, each waiting only for its own build and the Browser
  # wheel. Within the system Node.js and the BrowserBatteries entries of all
  # platforms, every Python and Robot Framework version runs once.
  atest-wheel-linux:
    name: Acceptance tests from wheel (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.batteries && 'BrowserBatteries' || matrix.node-version }})
    needs: [runners, build_wheels]
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ["nscloud-ubuntu-24.04-amd64-8x16-with-cache", "nscloud-runner-tool-cache-20gb"]
            python-version: "3.11"
            rf-version: "7.1.1"
            node-version: 22.x
          - os: ubuntu-latest
            runner: ["nscloud-ubuntu-24.04-amd64-8x16-with-cache", "nscloud-runner-tool-cache-20gb"]
            python-version: "3.13"
            rf-version: "7.5.1"
            batteries: true
    env: &atest_wheel_env
      SYS_VAR_CI_INSTALL_TEST: 1
      # Python 3.15 is a prerelease and cryptography ships no Intel macOS wheels,
      # so those two may build from source.
      NO_BUILD: ${{ (matrix.python-version != '3.15' && matrix.os != 'macos-15-intel') && '--no-build' || '' }}
    steps: &atest_wheel_steps
      - uses: actions/checkout@v7
      - name: Download the Browser wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: wheels/browser
      - name: Download the BrowserBatteries wheel
        if: ${{ matrix.batteries }}
        uses: actions/download-artifact@v8
        with:
          name: browser-batteries-wheels-${{ matrix.os }}
          path: wheels/batteries
      - name: Download the demo app
        uses: actions/download-artifact@v8
        with:
          name: demoapp-${{ matrix.os }}
          path: demoapp
      - name: Use Node.js
        if: ${{ !matrix.batteries }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --no-config: the [tool.uv] settings of pyproject.toml are for the lock
      # file, and its exclude-dependencies would skip BrowserBatteries.
      - name: Install the wheels
        shell: bash
        run: |
          ls -lR wheels
          uv pip install --no-config wheels/*/*.whl --python ${{ matrix.python-version }} --system
          rfbrowser --version
      - name: Install the Node.js dependencies and browsers
        if: ${{ !matrix.batteries }}
        shell: bash
        run: |
          rfbrowser init
      - name: Install the browsers
        if: ${{ matrix.batteries }}
        shell: bash
        run: |
          .github/scripts/install-playwright.sh rfbrowser install
      - name: Install the test dependencies and Robot Framework ${{ matrix.rf-version }}
        shell: bash
        run: |
          uv export --locked --only-group dev --no-emit-project --output-file dev-requirements.txt
          uv pip install --no-config --require-hashes $NO_BUILD -r dev-requirements.txt --python ${{ matrix.python-version }} --system
          uv pip install --no-config $NO_BUILD robotframework==${{ matrix.rf-version }} --python ${{ matrix.python-version }} --system
          python atest/library/os_wrapper.py
      # The tests must import the installed packages, not the sources.
      - name: Replace the sources with the demo app
        shell: bash
        run: |
          rm -rf Browser browser_batteries node
          python -m zipfile -e demoapp/demo-app*.zip .
          ls node
      - name: Run Robot Framework tests on Linux
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          xvfb-run --auto-servernum inv atest-robot --parallel --browser ${{ env.ATEST_BROWSER }}
      - name: Run Robot Framework tests on Windows or macOS
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: |
          inv atest-robot --parallel --browser ${{ env.ATEST_BROWSER }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Wheel test results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.batteries && 'batteries' || matrix.node-version }}
          path: atest/output
      - name: Github Job Summary
        if: ${{ always() && hashFiles('atest/output/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog atest/output/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md
      # Uninstalling BrowserBatteries on Windows failed now and then, because a
      # process still held its wrapper folder. Names the processes left over.
      - name: List the processes still running from the library
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && matrix.batteries }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.ExecutablePath -like '*site-packages*' -or $_.CommandLine -like '*site-packages*' } |
            Format-List ProcessId, ParentProcessId, Name, CreationDate, CommandLine
      - name: Uninstall
        if: ${{ matrix.os != 'windows-latest' || matrix.batteries }}
        shell: bash
        run: |
          rfbrowser clean-node
          uv pip uninstall --no-config robotframework-browser ${{ matrix.batteries && 'robotframework-browser-batteries' || '' }} --python ${{ matrix.python-version }} --system

  atest-wheel-arm:
    name: Acceptance tests from wheel (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.batteries && 'BrowserBatteries' || matrix.node-version }})
    needs: [runners, build_wheels, build_wheels_arm]
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            # The slowest wheel test: 312 s on 8 vCPU, 182 s on 16.
            runner: ["nscloud-ubuntu-24.04-arm64-16x32-with-cache", "nscloud-runner-tool-cache-20gb"]
            python-version: "3.15"
            rf-version: "7.2.2"
            batteries: true
    env: *atest_wheel_env
    steps: *atest_wheel_steps

  atest-wheel-windows:
    name: Acceptance tests from wheel (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.batteries && 'BrowserBatteries' || matrix.node-version }})
    needs: [runners, build_wheels, build_wheels_windows]
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: nscloud-windows-2022-amd64-16x32
            python-version: "3.12"
            rf-version: "7.2.2"
            node-version: 24.x
          - os: windows-latest
            runner: nscloud-windows-2022-amd64-16x32
            python-version: "3.14"
            rf-version: "7.1.1"
            batteries: true
    env: *atest_wheel_env
    steps: *atest_wheel_steps

  atest-wheel-macos:
    name: Acceptance tests from wheel (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.rf-version }}, ${{ matrix.batteries && 'BrowserBatteries' || matrix.node-version }})
    needs: [runners, build_wheels, build_wheels_macos]
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && matrix.runner || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: nscloud-macos-sequoia-arm64-12x28
            python-version: "3.13"
            rf-version: "7.3.2"
            node-version: 26.x
          - os: macos-latest
            runner: nscloud-macos-sequoia-arm64-6x14
            python-version: "3.11"
            rf-version: "7.3.2"
            batteries: true
    env: *atest_wheel_env
    steps: *atest_wheel_steps

  atest-wheel-intel:
    if: github.event_name == 'schedule'
    needs:
      - build_wheels
      - build_wheels_intel
    # Spelled out: GitHub leaves the matrix in the name of a skipped job.
    name: Acceptance tests from wheel (macos-15-intel, 3.14, 7.5.1, BrowserBatteries)
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            python-version: "3.14"
            rf-version: "7.5.1"
            batteries: true
    env:
      SYS_VAR_CI_INSTALL_TEST: 1
      NO_BUILD: ""
    steps: *atest_wheel_steps

  docker_image:
    runs-on: ${{ needs.runners.outputs.namespace == 'true' && fromJSON('["nscloud-ubuntu-24.04-amd64-16x32-with-cache", "nscloud-runner-tool-cache-20gb"]') || 'ubuntu-latest' }}
    needs: [runners, build_wheels]
    if: ${{ !cancelled() && needs.build_wheels.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/marketsquare/robotframework-browser/rfbrowser
          tags: |
            type=raw,value=tidii
      - name: Download browser wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: docker/dist
      - name: Build with GitHub Packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev_pr
          tags: tidii
          labels: ${{ steps.meta.outputs.labels }}
          push: false
      - name: Download demo app
        uses: actions/download-artifact@v8
        with:
          name: demoapp-ubuntu-latest
          path: demoapp
      - name: unzip demo app
        run: |
          rm -rf node
          ls -l demoapp
          unzip demoapp/demo-app*.zip -d .
          ls -l node
      - name: Start demo app and run tests with docker image
        run: |
          uv sync --locked --no-build --only-group dev
          set +e
          docker run \
            -v ./atest/:/home/pwuser/atest \
            -v ./node/:/home/pwuser/node \
            -t tidii:latest \
            bash -lc "
              node /home/pwuser/node/dynamic-test-app/dist/server.js > /tmp/test-app.log 2>&1 &
              app_pid=\$!
              for i in \$(seq 1 30); do
                if curl --fail --silent --show-error http://localhost:7272/dist/ > /dev/null; then
                  break
                fi
                sleep 1
              done
              if ! curl --fail --silent --show-error http://localhost:7272/dist/ > /dev/null; then
                echo 'Test app failed to start inside container.'
                cat /tmp/test-app.log
                exit 1
              fi
              pabot --processes \$((\$(nproc) - 1)) --pabotlib --pabotlibport 0 \\
                --ordering /home/pwuser/atest/atest_order.data \\
                --artifacts png,webm,zip --artifactsinsubfolders \\
                -v SERVER:localhost:7272 --exclude no-docker-pr -L debug --outputdir /home/pwuser/output /home/pwuser/atest/test
              robot_status=\$?
              kill \$app_pid || true
              wait \$app_pid 2>/dev/null || true
              exit \$robot_status
            "
          docker_status=$?
          inv docker-copy-output
          copy_status=$?
          if [ "$docker_status" -ne 0 ]; then
            exit "$docker_status"
          fi
          exit "$copy_status"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: docker_results
          path: output_docker
      - name: Github Job Summary
        if: ${{ always() && hashFiles('output_docker/output.xml') != '' }}
        run: |
          python -m GHAReports --robotlog output_docker/output.xml --markdown fail.md --no-totals --no-passes --no-skipped --fails --no-warnings
          cat fail.md

  # Everything green on main becomes the wheels at
  # https://github.com/MarketSquare/robotframework-browser/releases/tag/nightly
  # so that a fix can be tried out without waiting for a release. Needs the test
  # jobs and not just the build jobs, because untested wheels are worse than no
  # wheels: whoever installs them cannot tell our breakage from theirs.
  publish_nightly:
    name: Publish the nightly wheels
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - nightly_version
      - lint
      - utest
      - atest-source
      - atest-wheel-linux
      - atest-wheel-arm
      - atest-wheel-windows
      - atest-wheel-macos
      - build_wheels
      - build_wheels_arm
      - build_wheels_windows
      - build_wheels_macos
      - build_wheels_intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the Browser wheel
        uses: actions/download-artifact@v8
        with:
          name: rfbrowser-wheel
          path: nightly-wheels
      - name: Download the BrowserBatteries wheels
        uses: actions/download-artifact@v8
        with:
          pattern: browser-batteries-wheels-*
          merge-multiple: true
          path: nightly-wheels
      - name: Replace the assets on the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.nightly_version.outputs.version }}
        run: |
          bash .github/scripts/publish-nightly.sh